<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <!-- 夜班病区：惨白走廊（一点透视，消失点 800,430）。过曝的荧光灯 + 旧血三处。 -->
  <defs>
    <linearGradient id="ward-air" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e3e9e5"/><stop offset="1" stop-color="#b3bcb7"/>
    </linearGradient>
    <linearGradient id="ward-floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9aa3a0"/><stop offset="1" stop-color="#6e7876"/>
    </linearGradient>
    <radialGradient id="ward-vignette" cx="0.5" cy="0.54" r="0.78">
      <stop offset="0" stop-color="#0b0f10" stop-opacity="0"/>
      <stop offset=".62" stop-color="#0b0f10" stop-opacity=".16"/>
      <stop offset="1" stop-color="#0b0f10" stop-opacity=".52"/>
    </radialGradient>
    <filter id="ward-soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="15"/>
    </filter>
    <filter id="ward-lamp" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <!-- 楼层牌用的等宽字形（画成路径，不依赖任何字体） -->
    <g id="dg-0" fill="none"><path d="M1 0 H7 V15 H1 Z"/></g>
    <g id="dg-1" fill="none"><path d="M4 0 V15 M4 0 L0 4"/></g>
    <g id="dg-2" fill="none"><path d="M0 0 H8 V7 H0 V15 H8"/></g>
    <g id="dg-3" fill="none"><path d="M0 0 H8 V15 H0 M0 7.5 H8"/></g>
    <g id="dg-4" fill="none"><path d="M6 0 L0 9 H8 M6 0 V15"/></g>
    <g id="dg-5" fill="none"><path d="M8 0 H0 V7 H8 V15 H0"/></g>
    <g id="dg-f" fill="none"><path d="M8 0 H0 V15 M0 7 H6"/></g>
  </defs>

  <rect width="1600" height="900" fill="url(#ward-air)"/>

  <!-- 壳：天花板 / 地面 / 左右墙 / 尽头墙 -->
  <polygon points="0,0 1600,0 980,250 620,250" fill="#cfd7d3"/>
  <polygon points="0,900 1600,900 980,560 620,560" fill="url(#ward-floor)"/>
  <polygon points="0,0 620,250 620,560 0,900" fill="#c3ccc8"/>
  <polygon points="1600,0 980,250 980,560 1600,900" fill="#bcc6c2"/>
  <rect x="620" y="250" width="360" height="310" fill="#c8d1cd"/>

  <!-- 墙裙：下半是白瓷砖（比上半亮一档）；缝线低对比 -->
  <polygon points="0,520 620,450 620,560 0,900" fill="#dde4df"/>
  <polygon points="1600,520 980,450 980,560 1600,900" fill="#d7dfda"/>
  <g stroke="#aeb8b4" stroke-width="1.4" opacity=".9" fill="none">
    <path d="M0 520 L620 450 M0 640 L620 520 M0 760 L620 590"/>
    <path d="M1600 520 L980 450 M1600 640 L980 520 M1600 760 L980 590"/>
    <path d="M120 900 L226 250 M300 900 L323 250 M520 900 L440 250 M700 900 L547 250"/>
    <path d="M1480 900 L1374 250 M1300 900 L1277 250 M1080 900 L1160 250 M900 900 L1053 250"/>
  </g>
  <!-- 一块后补的瓷砖（色差半档） -->
  <polygon points="300,510 420,488 420,536 300,562" fill="#cdd6d1"/>
  <polygon points="300,510 420,488 420,536 300,562" fill="none" stroke="#aeb8b4" stroke-width="1.2"/>

  <!-- 扶手（带残胶） + 踢脚 -->
  <polygon points="0,470 620,415 620,431 0,488" fill="#7f8a86"/>
  <path d="M0 469 L620 414" stroke="#e8f0eb" stroke-width="2"/>
  <path d="M150 466 L232 459" stroke="#5c6663" stroke-width="3" opacity=".35"/>
  <polygon points="1600,470 980,415 980,431 1600,488" fill="#78837f"/>
  <path d="M1600 469 L980 414" stroke="#e8f0eb" stroke-width="2"/>
  <polygon points="0,880 620,548 620,560 0,900" fill="#8d9793" opacity=".55"/>
  <polygon points="1600,880 980,548 980,560 1600,900" fill="#8d9793" opacity=".45"/>

  <!-- 旧血 ①：墙裙高度的一段擦拭痕（不规则 + 边缘发虚，不是红管子） -->
  <g filter="url(#ward-soft)" opacity=".42">
    <path d="M100 612 q54 -16 108 -6 q42 8 62 -2 q-22 22 -74 22 q-58 2 -96 -14z" fill="#7d1f24"/>
    <ellipse cx="128" cy="626" rx="16" ry="7" fill="#7d1f24"/>
    <ellipse cx="252" cy="606" rx="11" ry="6" fill="#7d1f24"/>
  </g>
  <path d="M136 608 q34 -8 62 -3" stroke="#5e171b" stroke-width="2.4" opacity=".38"/>

  <!-- 顶灯：格栅灯管 ×3（最近那盏在闪，class 由资源包的 css 提供） -->
  <g>
    <polygon points="700,254 900,254 906,266 694,266" fill="#8d9793"/>
    <polygon points="706,258 894,258 900,264 700,264" fill="#fbfefc" opacity=".92"/>
    <polygon points="540,150 1060,150 1080,176 520,176" fill="#8d9793"/>
    <polygon points="556,158 1044,158 1056,170 544,170" fill="#fbfefc" opacity=".95"/>
    <polygon points="300,14 1300,14 1340,58 260,58" fill="#8d9793"/>
    <polygon class="ward-flicker" points="320,26 1280,26 1300,46 300,46" fill="#ffffff"/>
    <polygon points="300,14 1300,14 1340,58 260,58" fill="#ffffff" opacity=".55" filter="url(#ward-lamp)"/>
  </g>
  <!-- 灯下墙面的硬边光斑：每盏灯一对，正对灯位、贴墙收敛（不是贴板子） -->
  <g fill="#ffffff" opacity=".62">
    <polygon points="486,190 620,168 620,318 486,346"/>
    <polygon points="1114,190 980,168 980,318 1114,346"/>
    <polygon points="200,60 420,124 420,232 200,176"/>
    <polygon points="1400,60 1180,124 1180,232 1400,176"/>
  </g>
  <!-- 地面反光：灯管的倒影（惨白的走廊靠这个"亮"起来） -->
  <g fill="#f4f9f7" opacity=".22">
    <polygon points="300,742 1300,742 1180,800 420,800"/>
    <polygon points="560,660 1040,660 1000,700 600,700"/>
  </g>
  <!-- 地面瓷砖：横缝（向消失点收） + 纵缝，缝线低对比 -->
  <g stroke="#8b9591" stroke-width="1.6" opacity=".5" fill="none">
    <path d="M0 646 L1600 646 M0 712 L1600 712 M0 792 L1600 792"/>
    <path d="M760 900 L796 562 M640 900 L760 562 M520 900 L724 562 M400 900 L688 562 M280 900 L652 562"/>
    <path d="M840 900 L804 562 M960 900 L840 562 M1080 900 L876 562 M1200 900 L912 562 M1320 900 L948 562"/>
  </g>
  <!-- 地面靠墙的深色边条（瓷砖靠墙那一圈），比棋盘格更稳 -->
  <g fill="#5f6a67" opacity=".5">
    <polygon points="0,900 620,560 620,596 0,900"/>
    <polygon points="1600,900 980,560 980,596 1600,900"/>
  </g>

  <!-- 左墙细节：通风口（细框 + 暗缝） + 呼叫铃（常亮） -->
  <g>
    <rect x="140" y="180" width="124" height="72" fill="#9aa4a0" stroke="#7f8a86" stroke-width="2"/>
    <path d="M146 192 H258 M146 206 H258 M146 220 H258 M146 234 H258 M146 246 H258" stroke="#39433e" stroke-width="4"/>
    <path d="M140 252 h124" stroke="#8b9591" stroke-width="2" opacity=".7"/>
    <rect x="298" y="388" width="34" height="46" rx="4" fill="#eef3f0" stroke="#7f8a86" stroke-width="2.4"/>
    <path d="M303 400 h24" stroke="#8b9591" stroke-width="2" opacity=".7"/>
    <circle cx="315" cy="419" r="6" fill="#b0433d"/>
    <circle cx="315" cy="419" r="15" fill="#b0433d" opacity=".28" filter="url(#ward-soft)"/>
  </g>

  <!-- 右墙：歪掉的挂钟 -->
  <g transform="rotate(-7 1360 300)">
    <circle cx="1360" cy="300" r="46" fill="#e8f0eb" stroke="#7f8a86" stroke-width="3"/>
    <path d="M1360 300 V272" stroke="#3d4744" stroke-width="3"/>
    <path d="M1360 300 L1338 318" stroke="#3d4744" stroke-width="3"/>
    <circle cx="1360" cy="300" r="3" fill="#3d4744"/>
  </g>

  <!-- 右墙：楼层指示牌 1F / 2F / 3F /（4 被擦掉，只剩一点渗色）/ 5F -->
  <g>
    <polygon points="1140,250 1248,236 1256,432 1148,448" fill="#f2f7f4"/>
    <g stroke="#2a3431" stroke-width="3" stroke-linecap="square">
      <use href="#dg-1" x="1166" y="272"/><use href="#dg-f" x="1182" y="272"/>
      <use href="#dg-2" x="1166" y="308"/><use href="#dg-f" x="1182" y="308"/>
      <use href="#dg-3" x="1166" y="344"/><use href="#dg-f" x="1182" y="344"/>
      <use href="#dg-5" x="1166" y="416"/><use href="#dg-f" x="1182" y="416"/>
    </g>
    <!-- 旧血 ②：4F 那一行被擦过，边缘一点渗色（不规则、不发光） -->
    <path d="M1160 372 L1196 366 L1194 390 L1158 396 Z" fill="#d3dbd7"/>
    <path d="M1152 384 L1204 376" stroke="#a8b2ae" stroke-width="2" opacity=".7"/>
    <path d="M1190 370 q8 -3 12 2 q-4 6 -12 4 q-6 -2 0 -6z" fill="#7d1f24" opacity=".38"/>
  </g>

  <!-- 尽头墙：门（门后纯黑）+ 门牌 404 + 门缝冷光 -->
  <g>
    <rect x="730" y="318" width="140" height="242" fill="#2a3431" stroke="#7f8a86" stroke-width="3"/>
    <path d="M760 318 V560 M840 318 V560" stroke="#3d4744" stroke-width="2"/>
    <rect x="762" y="342" width="76" height="30" fill="#f2f7f4"/>
    <g stroke="#2a3431" stroke-width="3.4" stroke-linecap="square">
      <use href="#dg-4" x="778" y="350"/><use href="#dg-0" x="790" y="350"/><use href="#dg-4" x="802" y="350"/>
    </g>
    <rect x="736" y="550" width="128" height="10" fill="#dff0ea" opacity=".85"/>
    <rect x="736" y="550" width="128" height="24" fill="#dff0ea" opacity=".4" filter="url(#ward-soft)"/>
    <rect x="848" y="430" width="10" height="42" rx="3" fill="#7f8a86"/>
  </g>

  <!-- 旧血 ③：门缝下拖出来的一道窄痕（断续、不对称，不是红毯） -->
  <path d="M792 562 q10 22 4 40 q-6 16 2 28 q-10 -4 -14 -18 q-6 -20 2 -34 q4 -10 6 -16z" fill="#7d1f24" opacity=".42"/>
  <path d="M818 566 q6 18 14 30 q-12 -2 -18 -14 q-4 -10 4 -16z" fill="#7d1f24" opacity=".3"/>
  <ellipse cx="772" cy="640" rx="9" ry="5" fill="#5e171b" opacity=".34"/>
  <ellipse cx="828" cy="608" rx="6" ry="4" fill="#5e171b" opacity=".28"/>

  <!-- 空气感 + 暗角（惨白走廊要压一下，否则 UI 文字会被吃掉） -->
  <rect x="620" y="250" width="360" height="310" fill="#ffffff" opacity=".18" filter="url(#ward-soft)"/>
  <rect width="1600" height="900" fill="url(#ward-vignette)"/>
</svg>
